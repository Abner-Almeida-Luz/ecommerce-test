spring:
  application:
    name: ecommerce-project

  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_test?sslmode=disable
    username: postgres
    password: postgres123

  jpa:
    hibernate:
      ddl-auto: validate
      open-in-view: false

  properties:
    hibernate:
      format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-on-validation-error: true

server:
  port: 8080

api:
  security:
    token:
      secret: my-secret-key
      refreshSecret: my-refresh-secret-key

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: TRACE

info:
  app:
    name: ecommerce-api
    version: 1.0.0

---
# Perfil Docker
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://host.docker.internal:5432/ecommerce_test?sslmode=disable
    username: postgres
    password: postgres123