spring:
  profiles:
    active: prod
  application:
    name: ecommerce-project

  datasource:
    # Em desenvolvimento local, use esse valor (opcional)
    url: jdbc:postgresql://localhost:5432/ecommerce_test?sslmode=disable
    username: postgres
    password: postgres123

  jpa:
    hibernate:
      ddl-auto: validate
      show-sql: false
      open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-on-validation-error: true
    baseline-on-migrate: true

server:
  port: 8080
  address: 0.0.0.0

api:
  security:
    token:
      secret: my-secret-key
      refreshSecret: my-refresh-secret-key

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    com.AbnerTest: DEBUG

info:
  app:
    name: ecommerce-api
    version: 1.0.0

---
# Perfil Docker
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://host.docker.internal:5432/ecommerce_test?sslmode=disable
    username: postgres
    password: postgres123

---
# Perfil Produção (Railway)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver   # <-- corrigido